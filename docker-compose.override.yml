# The Scorpio broker is part of the development setup: the app proxies it at
# /data and `task import` writes to it. It lives here rather than in
# docker-compose.yml so the template file stays comparable with symfony-8.
networks:
    scorpio:

services:
    scorpio:
        image: scorpiobroker/all-in-one-runner:java-latest
        restart: "no"
        # Scorpio publishes no arm64 image.
        platform: "linux/amd64"
        ports:
            - "9090"
        environment:
            - DBHOST=scorpio-db
        depends_on:
            scorpio-db:
                condition: service_healthy
        networks:
            # On `app` so phpfpm can reach it as APP_BROKER_BASE_URI; on
            # `scorpio` so it can reach its own database.
            - app
            - scorpio

    scorpio-db:
        image: postgis/postgis
        platform: "linux/amd64"
        environment:
            - POSTGRES_USER=ngb
            - POSTGRES_PASSWORD=ngb
            - POSTGRES_DB=ngb
        healthcheck:
            test: ["CMD-SHELL", "pg_isready --username=ngb --dbname=ngb"]
            start_period: 10s
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - scorpio
        volumes:
            - ./.docker/data/scorpio-db:/var/lib/postgresql/data
        # https://stackoverflow.com/a/58806511
        command: ["postgres", "-c", "log_statement=all"]
