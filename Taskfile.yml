# https://taskfile.dev — install with `brew install go-task`.
# Run `task` (or `task --list-all`) to see all available commands.

version: '3'

# https://taskfile.dev/usage/#env-files
dotenv: ['.env.local', '.env']

vars:
  # Set TASK_DOCKER_COMPOSE=docker compose to bypass the itk-dev wrapper.
  DOCKER_COMPOSE: '{{.TASK_DOCKER_COMPOSE | default "itkdev-docker-compose"}}'

tasks:
  # ---------------------------------------------------------------- Site ---

  site:install:
    desc: Install site from scratch
    prompt: Really (re)install site? This deletes the broker database.
    cmds:
      - task: compose
        vars:
          TASK_ARGS: down --volumes --remove-orphans
      - rm -fr .docker/data/scorpio-db/
      - task: site:update

  site:update:
    desc: Update site
    cmds:
      - task: traefik:start
      - task: compose
        vars:
          TASK_ARGS: pull
      - task: compose
        vars:
          TASK_ARGS: up --detach --remove-orphans
      - task: composer
        vars:
          TASK_ARGS: install
      - task: console
        vars:
          TASK_ARGS: cache:clear

  site:open:
    desc: Open the site in a browser
    cmd: '{{.DOCKER_COMPOSE}} open'

  traefik:start:
    desc: Start the shared Traefik reverse proxy
    # Traefik is a stack of its own. Without unsetting COMPOSE_PROJECT_NAME —
    # which the dotenv block above exports — it would be brought up under this
    # project's name and get its own proxy network instead of joining the
    # shared one.
    cmd: env -u COMPOSE_PROJECT_NAME itkdev-docker-compose traefik:start

  # ----------------------------------------------------------- Wrappers ---

  compose:
    desc: 'Run a docker compose command, e.g. task compose -- logs --follow'
    cmd: '{{.DOCKER_COMPOSE}} {{.TASK_ARGS}} {{.CLI_ARGS}}'

  composer:
    desc: 'Run composer, e.g. task composer -- require symfony/uid'
    cmd: '{{.DOCKER_COMPOSE}} run --rm --no-deps phpfpm composer {{.TASK_ARGS}} {{.CLI_ARGS}}'

  php:
    desc: 'Run a command in a one-off phpfpm container, e.g. task php -- vendor/bin/phpstan'
    cmd: '{{.DOCKER_COMPOSE}} run --rm --no-deps phpfpm {{.TASK_ARGS}} {{.CLI_ARGS}}'

  console:
    desc: 'Run a Symfony console command, e.g. task console -- debug:router'
    cmd: '{{.DOCKER_COMPOSE}} exec phpfpm bin/console {{.TASK_ARGS}} {{.CLI_ARGS}}'

  shell:
    desc: Open a shell in the running phpfpm container
    cmd: '{{.DOCKER_COMPOSE}} exec phpfpm bash'

  # -------------------------------------------------------------- Tests ---

  test:
    desc: 'Run the test suite, e.g. task test -- --filter=FeedReader'
    env:
      APP_ENV: test
    cmd: '{{.DOCKER_COMPOSE}} run --rm --no-deps phpfpm bin/phpunit {{.CLI_ARGS}}'

  # ------------------------------------------------------------- Broker ---

  # Scorpio comes up with the rest of the stack (docker-compose.override.yml),
  # so there is no separate start task. Read requests need the domain context
  # in a Link header, which the script supplies; the env values come from the
  # dotenv block above and are passed into the container explicitly because it
  # does not read .env itself.
  import:
    desc: 'Import a source into the broker, e.g. task import -- mtm_spatialmaps-handicap-parking'
    cmd: '{{.DOCKER_COMPOSE}} exec phpfpm bin/console app:import {{.CLI_ARGS}}'

  broker:entities:
    desc: 'List broker entities of a type, e.g. task broker:entities -- OnStreetParking 10'
    cmd: >-
      {{.DOCKER_COMPOSE}} exec
      --env APP_BROKER_BASE_URI="$APP_BROKER_BASE_URI"
      --env ENTER_NGSI_DOMAIN_CONTEXT="$ENTER_NGSI_DOMAIN_CONTEXT"
      phpfpm sh task/scripts/broker-entities {{.CLI_ARGS}}

  # ---------------------------------------------------- Coding standards ---

  coding-standards:apply:
    desc: 'Apply coding standards'
    cmds:
      - task: coding-standards:assets:apply
      - task: coding-standards:composer:apply
      - task: coding-standards:markdown:apply
      - task: coding-standards:php:apply
      - task: coding-standards:twig:apply
      - task: coding-standards:yaml:apply

  coding-standards:check:
    desc: 'Apply and check coding standards'
    cmds:
      - task: coding-standards:assets:check
      - task: coding-standards:composer:check
      - task: coding-standards:markdown:check
      - task: coding-standards:php:check
      - task: coding-standards:twig:check
      - task: coding-standards:yaml:check

  coding-standards:assets:apply:
    desc: 'Apply coding standards for assets'
    cmd:
      task: compose
      vars:
        TASK_ARGS: run --rm prettier 'assets/' --write

  coding-standards:assets:check:
    desc: 'Apply and check coding standards for assets'
    cmds:
      - task: coding-standards:assets:apply
      - task: compose
        vars:
          TASK_ARGS: run --rm prettier 'assets/' --check

  coding-standards:composer:apply:
    desc: 'Apply coding standards for Composer'
    cmd:
      task: composer
      vars:
        TASK_ARGS: normalize

  coding-standards:composer:check:
    desc: 'Apply and check coding standards for Composer'
    cmds:
      - task: coding-standards:composer:apply
      - task: composer
        vars:
          TASK_ARGS: audit
      - task: composer
        vars:
          TASK_ARGS: normalize --dry-run
      - task: composer
        vars:
          TASK_ARGS: validate --strict

  coding-standards:markdown:apply:
    desc: 'Apply coding standards for Markdown'
    cmds:
      - task: compose
        vars:
          TASK_ARGS: run --rm markdownlint '**/*.md' --fix

  coding-standards:markdown:check:
    desc: 'Apply and check coding standards for Markdown'
    cmds:
      - task: coding-standards:markdown:apply
      - task: compose
        vars:
          TASK_ARGS: run --rm markdownlint '**/*.md'

  coding-standards:php:apply:
    desc: 'Apply coding standards for PHP'
    cmds:
      - task: php
        vars:
          TASK_ARGS: vendor/bin/rector
      - task: php
        vars:
          TASK_ARGS: vendor/bin/php-cs-fixer fix

  coding-standards:php:check:
    desc: 'Apply and check coding standards for PHP'
    cmds:
      - task: coding-standards:php:apply
      - task: php
        vars:
          TASK_ARGS: vendor/bin/rector --dry-run
      - task: php
        vars:
          TASK_ARGS: vendor/bin/php-cs-fixer check

  coding-standards:twig:apply:
    desc: 'Apply coding standards for Twig'
    cmd:
      task: php
      vars:
        TASK_ARGS: vendor/bin/twig-cs-fixer fix

  coding-standards:twig:check:
    desc: 'Apply and check coding standards for Twig'
    cmds:
      - task: coding-standards:twig:apply
      - task: php
        vars:
          TASK_ARGS: vendor/bin/twig-cs-fixer check

  coding-standards:yaml:apply:
    desc: 'Apply coding standards for YAML'
    cmds:
      - task: compose
        vars:
          TASK_ARGS: run --rm prettier --parser yaml phpstan*.neon '**/*.{yml,yaml}' --write

  coding-standards:yaml:check:
    desc: 'Apply and check coding standards for YAML'
    cmds:
      - task: coding-standards:yaml:apply
      - task: compose
        vars:
          TASK_ARGS: run --rm prettier --parser yaml phpstan*.neon '**/*.{yml,yaml}' --check

  # ------------------------------------------------------ Code analysis ---

  code-analysis:
    desc: 'Run code analysis'
    cmds:
      - task: code-analysis:phpstan

  code-analysis:phpstan:
    desc: 'Run PHPStan'
    cmds:
      - task: composer
        vars:
          TASK_ARGS: install --no-scripts
      - task: php
        vars:
          TASK_ARGS: vendor/bin/phpstan

  default:
    cmds:
      - task --list-all
    silent: true
